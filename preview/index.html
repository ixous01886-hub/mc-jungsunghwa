<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>메인화면 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg: #0a0f1c; --card: #141c30; --ink: #fff; --muted: #9aa6bc; --blue: #2f8bff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", -apple-system, sans-serif; padding: 40px 16px; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; line-height: 1.6; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border-radius: 18px; overflow: hidden; margin-bottom: 16px; border: 1px solid rgba(255,255,255,.08); }
  a.card img { width: 100%; height: 180px; object-fit: cover; object-position: top; display: block; }
  a.card div { padding: 16px 18px; }
  a.card b { display: block; font-size: 18px; }
  a.card span { color: var(--muted); font-size: 14px; }
  a.card em { float: right; font-style: normal; color: var(--blue); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>메인화면 시안 2가지</h1>
  <p>눌러서 들어가 보세요. 실제 홈페이지가 아니라 미리보기용 화면이에요.</p>
  <a class="card" href="a.html"><img src="assets/person-burgundy.webp" alt=""><div><em>보기 →</em><b>시안 A</b><span>인트로 영상 배경</span></div></a>
  <a class="card" href="b.html"><img src="assets/stage-bg.jpg" alt=""><div><em>보기 →</em><b>시안 B</b><span>무대 공연장 배경</span></div></a>
</main>
</body>
</html>
